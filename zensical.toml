[project]
site_url = "https://agentstatuscodes.org/"
site_name = "Agent Status Codes"
site_description = "The semantic control layer for autonomous work."
site_author = "Agent Status Codes contributors"
copyright = "Released under the MIT License. ASC 0.1 is an experimental draft."
repo_url = "https://github.com/prassanna-ravishankar/agent-status-codes"
repo_name = "prassanna-ravishankar/agent-status-codes"
edit_uri = "edit/main/docs/"

nav = [
  { "Get started" = [
    { "Introduction" = "index.md" },
    { "Why ASC" = "why.md" },
    { "Core concepts" = "get-started/concepts.md" },
    { "Implement ASC" = "get-started/implementation.md" },
    { "Examples" = "examples.md" },
  ] },
  { "Specification" = [
    { "ASC 0.1" = "spec/index.md" },
    { "Status model" = "spec/status-model.md" },
    { "Code registry" = "spec/registry.md" },
    { "Status envelope" = "spec/envelope.md" },
    { "Retry contract" = "spec/retry.md" },
    { "Protocol bindings" = "spec/bindings.md" },
    { "Security and privacy" = "spec/security.md" },
  ] },
  { "RFCs" = [
    { "About RFCs" = "rfcs/index.md" },
    { "RFC process" = "rfcs/process.md" },
    { "RFC template" = "rfcs/template.md" },
  ] },
  { "Project" = [
    { "Contributing" = "contributing.md" },
  ] },
]

extra_css = ["assets/stylesheets/asc.css"]

[project.theme]
language = "en"
logo = "assets/images/asc-mark-v2.svg"
favicon = "assets/images/asc-mark-v2.svg"
font = false
features = [
  "content.action.edit",
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Use light theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Use dark theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Use system theme"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/prassanna-ravishankar/agent-status-codes"
name = "Agent Status Codes on GitHub"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true, toc_depth = 3 }
pymdownx.details = {}
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences = {}
pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
