name: Deploy to production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: clusterkit
  GKE_REGION: us-central1
  IMAGE: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gcr.io/agent-status-codes
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  NAMESPACE: agent-status-codes

jobs:
  build:
    name: Build and push
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Configure Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ClusterKit
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://agentstatuscodes.org
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
      - uses: azure/setup-helm@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
      - name: Ensure namespace exists
        run: kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy with Helm
        run: |
          helm upgrade --install agent-status-codes helm/agent-status-codes \
            --namespace "${NAMESPACE}" \
            --set image.repository="${IMAGE}" \
            --set image.tag="${IMAGE_TAG}" \
            --wait \
            --timeout 5m
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/agent-status-codes \
            --namespace "${NAMESPACE}" \
            --timeout 3m
          kubectl get httproute agent-status-codes \
            --namespace clusterkit \
            -o jsonpath='{range .status.parents[*].conditions[*]}{.type}={.status} {.reason}{"\n"}{end}'

  gate:
    name: Verify public readiness
    needs: deploy
    permissions:
      contents: read
      id-token: write
    uses: prassanna-ravishankar/clusterkit/.github/workflows/deploy-gate.yml@main
    with:
      hostnames: agentstatuscodes.org
    secrets: inherit
